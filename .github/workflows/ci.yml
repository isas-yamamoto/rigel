name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make CXX=g++

      - name: Run tests
        run: make CXX=g++ check

  strict-warnings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Build with -Wall -Wextra -Werror
        run: make CXX=g++ CXXFLAGS="-Wall -Wextra -Werror -O2 -std=c++11 -fPIC -pthread"

  thread-sanitizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Build with ThreadSanitizer
        run: g++ -Wall -O1 -g -std=c++11 -fsanitize=thread -pthread rigel.cc test.cc -o test_tsan

      - name: Run tests under ThreadSanitizer
        run: ./test_tsan

  address-ub-sanitizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan+UBSan
        run: g++ -Wall -O1 -g -std=c++11 -fsanitize=address,undefined -pthread rigel.cc test.cc -o test_asan

      - name: Run tests under ASan+UBSan
        run: ./test_asan

  cppcheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --std=c++11 --language=c++ \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=normalCheckLevelMaxBranches \
            rigel.cc rigel_cli.cc test.cc bench.cc rigel.h
