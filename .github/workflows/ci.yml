name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make CXX=g++

      - name: Run tests
        run: make CXX=g++ check

  strict-warnings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Build with -Wall -Wextra -Werror
        run: make CXX=g++ CXXFLAGS="-Wall -Wextra -Werror -O2 -std=c++11 -fPIC -pthread"

  thread-sanitizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Build with ThreadSanitizer
        run: g++ -Wall -O1 -g -std=c++11 -fsanitize=thread -pthread -I. rigel.cc ../tests/test.cc -o test_tsan

      - name: Run tests under ThreadSanitizer
        run: ./test_tsan

  address-ub-sanitizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan+UBSan
        run: g++ -Wall -O1 -g -std=c++11 -fsanitize=address,undefined -pthread -I. rigel.cc ../tests/test.cc -o test_asan

      - name: Run tests under ASan+UBSan
        run: ./test_asan

  cmake-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/rigel-install

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build

      - name: Verify installed pkg-config file and binary
        run: |
          PKG_CONFIG_PATH=${{ runner.temp }}/rigel-install/lib/pkgconfig pkg-config --cflags --libs rigel
          LD_LIBRARY_PATH=${{ runner.temp }}/rigel-install/lib ${{ runner.temp }}/rigel-install/bin/rigel version

      - name: Run Python wrapper smoke test
        run: |
          RIGEL_LIBRARY_PATH=${{ runner.temp }}/rigel-install/lib/librigel.so python3 tests/test_python.py

  cppcheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --std=c++11 --language=c++ \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=normalCheckLevelMaxBranches \
            -I. rigel.cc rigel_c.cc rigel_cli.cc ../tests/test.cc ../tests/test_c.c ../bench/bench.cc rigel.h rigel_c.h
